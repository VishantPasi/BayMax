<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30303a"/>
      <stop offset="1" stop-color="#111118"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="256" cy="468" rx="105" ry="18" fill="#8d8d99" opacity=".18"/>

  <!-- Antenna -->
  <path d="M256 55v25" stroke="#cfcfd8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="48" r="8" fill="#ef4b6f"/>

  <!-- Head -->
  <rect x="145" y="78" width="222" height="118" rx="54"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4" filter="url(#shadow)"/>
  <!-- Face display -->
  <rect x="164" y="105" width="184" height="62" rx="30" fill="url(#screen)"/>
  <circle cx="218" cy="136" r="9" fill="#ff5f83"/>
  <circle cx="294" cy="136" r="9" fill="#ff5f83"/>
  <path d="M227 136h58" stroke="#ff5f83" stroke-width="4" stroke-linecap="round"/>
  <!-- Ear pods -->
  <circle cx="143" cy="136" r="27" fill="#f5f5f8" stroke="#d7d7df" stroke-width="4"/>
  <circle cx="369" cy="136" r="27" fill="#f5f5f8" stroke="#d7d7df" stroke-width="4"/>
  <circle cx="143" cy="136" r="9" fill="#e6e6ec"/>
  <circle cx="369" cy="136" r="9" fill="#e6e6ec"/>

  <!-- Neck -->
  <rect x="226" y="188" width="60" height="30" rx="15" fill="#dedee5"/>

  <!-- Torso -->
  <rect x="164" y="205" width="184" height="160" rx="72"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4" filter="url(#shadow)"/>
  <rect x="205" y="246" width="102" height="48" rx="24" fill="#f4f4f7" stroke="#dedee5" stroke-width="3"/>
  <circle cx="237" cy="270" r="7" fill="#ef4b6f"/>
  <circle cx="256" cy="270" r="7" fill="#ef4b6f"/>
  <circle cx="275" cy="270" r="7" fill="#ef4b6f"/>

  <!-- Left arm -->
  <path d="M172 226 C142 237 127 274 122 307 C118 329 130 342 145 334
           C159 326 159 307 163 288 C168 264 180 252 190 244"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4"/>
  <circle cx="134" cy="330" r="19" fill="#f4f4f7" stroke="#d7d7df" stroke-width="4"/>

  <!-- Right arm -->
  <path d="M340 226 C370 237 385 274 390 307 C394 329 382 342 367 334
           C353 326 353 307 349 288 C344 264 332 252 322 244"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4"/>
  <circle cx="378" cy="330" r="19" fill="#f4f4f7" stroke="#d7d7df" stroke-width="4"/>

  <!-- Hip -->
  <rect x="190" y="346" width="132" height="48" rx="24" fill="#dedee5"/>

  <!-- Left leg -->
  <rect x="192" y="374" width="54" height="73" rx="27"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4"/>
  <!-- Right leg -->
  <rect x="266" y="374" width="54" height="73" rx="27"
        fill="url(#body)" stroke="#d7d7df" stroke-width="4"/>

  <!-- Feet -->
  <path d="M181 432h68c8 0 14 6 14 14v5c0 9-7 16-16 16h-66c-12 0-19-12-14-23l3-6c2-4 6-6 11-6z"
        fill="#eeeeF3" stroke="#d2d2da" stroke-width="4"/>
  <path d="M263 432h68c8 0 14 6 14 14v5c0 9-7 16-16 16h-66c-12 0-19-12-14-23l3-6c2-4 6-6 11-6z"
        fill="#eeeeF3" stroke="#d2d2da" stroke-width="4"/>
</svg>